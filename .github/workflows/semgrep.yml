name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    container:
      # Pinned. The floating tag dropped `semgrep ci --error` from under us and
      # broke main on a commit that had not touched this file.
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v7
      - name: Scan
        # `semgrep ci` already exits non-zero on a blocking finding, which is
        # what `--error` used to ask for before it was removed.
        run: semgrep ci --config p/python --config p/flask --config p/secrets
