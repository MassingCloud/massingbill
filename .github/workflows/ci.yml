name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        # Blocking, not advisory. A type check nobody has to fix is one nobody reads.
        run: mypy massingbill

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install the WeasyPrint native stack
        # This is what makes PDF export work. Installing it here means the
        # tests marked `pdf` run for real rather than skipping, so a regression
        # in the PDF pipeline fails the build instead of quietly disappearing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b             libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info             fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev,render]"

      - name: Confirm the PDF renderer is usable
        # Fail here rather than silently skipping the PDF tests below.
        run: |
          python - <<'PY'
          import sys
          from massingbill.services.renderers import PDF_AVAILABLE, pdf_unavailable_reason
          if not PDF_AVAILABLE:
              print(pdf_unavailable_reason())
              sys.exit(1)
          print("WeasyPrint loaded; PDF tests will run.")
          PY

      - name: Run tests
        # The floor rises with each phase; the money engine, retainage, the
        # period engine and the tie-out rules carry a 100% requirement of their
        # own, enforced by the `money-kernel` job below (SPEC.md 7).
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q --cov=massingbill --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Assert the PDF tests actually ran
        run: pytest -q -m pdf --no-header | tee /dev/stderr | grep -qv "no tests ran"

      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  money-kernel:
    name: Money kernel
    runs-on: ubuntu-latest
    # SPEC.md 5 and 7. Monetary values are integer cents, scaling arithmetic
    # lives only in the kernel, and the kernel is covered exhaustively. A stray
    # `line_total * rate` in a view helper is exactly how a pay app ends up a
    # penny off and gets rejected.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"

      - name: The kernel must be covered completely
        run: |
          pytest -q tests/test_money.py tests/test_money_properties.py \
            --cov=massingbill.services.money --cov-report=term-missing \
            --cov-fail-under=100

      - name: Widen the property search
        env:
          HYPOTHESIS_PROFILE: thorough
        run: pytest -q tests/test_money_properties.py

      - run: python scripts/check_money_discipline.py
      - name: The gate must reject a planted violation
        run: |
          cat > massingbill/_ci_violation.py <<'PY'
          def bad(scheduled_value_cents: int, rate: int) -> int:
              return scheduled_value_cents * rate
          PY
          if python scripts/check_money_discipline.py; then
            echo "money-discipline gate failed to catch a planted violation" >&2
            rm -f massingbill/_ci_violation.py
            exit 1
          fi
          rm -f massingbill/_ci_violation.py
          echo "gate correctly rejected the planted violation"

  offline:
    name: Offline (no network)
    runs-on: ubuntu-latest
    # The standalone promise, gate 1 of 3 (SPEC.md 3, 13). The suite already
    # blocks sockets in conftest; this job proves the *installed* package needs
    # nothing at import time either, with the network genuinely unavailable.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Import the whole package with every socket refused
        # Enforced in-process rather than with iptables.
        #
        # The iptables version matched the runner agent's own uid, so when an
        # import hung the REJECT rule was still in place and the runner lost
        # communication with GitHub -- a 45-minute job and an infrastructure
        # error instead of a test result. Patching socket.socket.connect proves
        # exactly the same property (nothing here needs the network) without
        # being able to take the machine down with it.
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import socket

          class NetworkUsed(RuntimeError):
              pass

          def refuse(self, address, *args, **kwargs):
              raise NetworkUsed(f"outbound connection attempted to {address!r}")

          socket.socket.connect = refuse
          socket.create_connection = refuse

          import massingbill
          # Single-sourced with the standalone-integrity test, so this job and
          # that test cannot disagree about what a minimal install may lack.
          from massingbill.optional import is_optional

          imported = 0
          for module in pkgutil.walk_packages(massingbill.__path__, "massingbill."):
              if is_optional(module.name):
                  continue
              importlib.import_module(module.name)
              imported += 1

          from massingbill import create_app

          app = create_app()
          assert app.test_client().get("/healthz").status_code == 200
          assert app.config["MASSINGBILL_ENTITLEMENT_PROVIDER"] == "standalone"
          print(f"imported {imported} modules, booted, and served /healthz with no network")
          PY

  no-adapters:
    name: No adapters (delete and re-run)
    runs-on: ubuntu-latest
    # The standalone promise, gate 2 of 3. If the core has quietly grown a
    # dependency on an optional adapter, this fails.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Remove every optional adapter and integration
        run: |
          rm -f massingbill/services/entitlement/massing_cloud.py
          rm -f massingbill/services/identity/oidc.py
          rm -f massingbill/services/storage/s3.py
          rm -f massingbill/services/storage/massing_vault.py
          rm -rf massingbill/services/integrations/*
          touch massingbill/services/integrations/__init__.py
      - name: The suite must still be green
        run: pytest -q

  imports:
    name: Import contracts
    runs-on: ubuntu-latest
    # The standalone promise, gate 3 of 3. Coupling becomes a build failure
    # rather than a code-review opinion.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: lint-imports

  migrations:
    name: Migrations (up, down, up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Round-trip the schema
        env:
          FLASK_APP: wsgi:app
          MASSINGBILL_ENV: development
          MASSINGBILL_DATABASE_URL: sqlite:///ci-migrations.sqlite3
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade
      - name: Fail if a model change has no migration
        env:
          FLASK_APP: wsgi:app
          MASSINGBILL_ENV: development
          MASSINGBILL_DATABASE_URL: sqlite:///ci-migrations.sqlite3
        run: |
          flask db check

  security:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Installed editable so `--skip-editable` below can exclude it. The point
      # of this job is the dependency tree; massingbill itself is not on PyPI,
      # so pip-audit cannot look it up and fails the whole run trying.
      - run: pip install -e ".[dev]" pip-audit cyclonedx-bom
      - name: Audit dependencies
        # No `--strict`: that flag also fails the run when any dependency is
        # *skipped*, which is precisely what `--skip-editable` does to our own
        # package. Without it pip-audit still exits non-zero on a real
        # vulnerability, which is the thing this job is for.
        run: pip-audit --skip-editable --progress-spinner off
      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

  docker:
    name: Container builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: massingbill:ci
      - name: Boot it on SQLite and probe both endpoints
        run: |
          docker run -d --name massingbill-ci -p 8000:8000 \
            -e MASSINGBILL_SECRET_KEY=ci-only-secret-key-value \
            -e MASSINGBILL_ENCRYPTION_KEY=ci-only-encryption-key-value \
            -e MASSINGBILL_SESSION_COOKIE_SECURE=false \
            massingbill:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
      - name: Container logs on failure
        if: failure()
        run: docker logs massingbill-ci || true
