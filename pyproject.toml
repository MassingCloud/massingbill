[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "massingbill"
version = "1.2.0"
description = "Standalone AIA-style GC billing engine: G702/G703, schedule of values, change orders, retainage, lien waivers and the monthly requisition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MassingCloud" }]
keywords = [
    "construction",
    "billing",
    "aia",
    "g702",
    "g703",
    "schedule of values",
    "retainage",
    "pay application",
    "lien waiver",
    "flask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# The standalone core. Nothing here reaches the network at import time or at
# runtime; optional adapters (S3, OIDC, massing.cloud) live in extras so a
# self-hoster installs exactly what they run. See SPEC.md section 3.
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-WTF>=1.2,<2.0",
    "Flask-Limiter>=3.5,<5.0",
    "WTForms>=3.1,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "email-validator>=2.1",
    "python-slugify>=8.0",
    "bleach>=6.1",
    "cryptography>=42.0",
    # TOTP two-factor. segno renders the enrolment QR as an inline SVG, which
    # keeps the strict default-src 'self' CSP intact -- no image host, no
    # third-party chart API, and nothing written to disk.
    "pyotp>=2.9",
    "segno>=1.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
server = ["gunicorn>=21.2"]
# Document rendering. Split out because WeasyPrint needs a native stack
# (pango/cairo) that a headless API-only deployment does not.
render = ["WeasyPrint>=61.0", "openpyxl>=3.1"]
# Optional adapters (SPEC.md 3.2). The core must import and test without these.
# joserfc is declared rather than left to Authlib: the adapter imports it
# directly, and depending on a transitive dependency is how a minor release
# of the parent removes it out from under you.
oidc = ["Authlib>=1.3,<2.0", "joserfc>=1.0", "requests>=2.31"]
s3 = ["boto3>=1.34"]
# massing.cloud entitlements and vault storage (P9). HTTP only -- massing.cloud
# is a WordPress storefront, so there is no Python package to depend on and
# never will be.
massing = ["requests>=2.31"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.9",
    "hypothesis>=6.100",
    "freezegun>=1.4",
    "responses>=0.25",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-requests",
    "types-bleach",
    "types-WTForms",
    "pypdf>=4.0",
    "types-openpyxl",
]

[project.urls]
Homepage = "https://github.com/MassingCloud/massingbill"
Repository = "https://github.com/MassingCloud/massingbill"
Issues = "https://github.com/MassingCloud/massingbill/issues"

[project.scripts]
massingbill = "massingbill.cli:main"

[tool.setuptools.packages.find]
include = ["massingbill*"]

[tool.setuptools.package-data]
massingbill = ["templates/**/*", "static/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The SDK ships beside the app rather than inside it (it is a client, and a
# self-hoster should not have to install it). Putting it on the path here is
# what lets the suite prove the client and the server agree.
pythonpath = ["sdk/python"]
markers = [
    "pdf: tests that require the WeasyPrint native stack (GTK/Pango/cairo)",
    "adapter: tests that exercise an optional adapter (SPEC.md 3.2)",
]

[tool.coverage.run]
source = ["massingbill"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    # The optional adapters, which the main test job deliberately does not
    # install -- that is the whole point of it. Their tests skip there, so
    # measuring them would be measuring code the job cannot run, and the number
    # would fall every time an adapter was added.
    #
    # They are not unmeasured: the `adapters` CI job installs every extra and
    # runs the `adapter`-marked tests against them. Kept in step with
    # `massingbill/optional.py`, which is the single source of truth for what
    # counts as optional.
    "*/services/entitlement/massing_cloud.py",
    "*/services/identity/oidc.py",
    "*/services/storage/s3.py",
    "*/services/storage/massing_vault.py",
    "*/services/integrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE", "S"]
ignore = [
    "B008",   # Flask/WTForms idiomatically call in argument defaults
    "RUF012", # SQLAlchemy declarative attrs are not ClassVar
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (that is the point) and use obviously-fake credentials.
"tests/**" = ["S101", "S105", "S106", "S311"]

# The core's own suite, which ships with the vendored core. It lives inside the
# package rather than in tests/ because it travels with the code it covers, and
# it is deliberately pytest-free -- plain asserts and a __main__ runner -- so it
# runs in a consumer's harness whatever that harness is.
"massingbill/core/tests/**" = ["S101", "E402"]

# The renderers produce typeset financial documents, where a true minus sign
# (U+2212) and an em dash are correct rather than accidental -- "(4 − 5)" on a
# payment application should not read as a hyphen.
#
# Scoped deliberately rather than switched off globally: RUF001 has already
# caught a real bug here, a non-breaking space hidden in a thousands-separator
# list that made perfectly ordinary pasted amounts unparseable.
"massingbill/services/renderers/*" = ["RUF001", "RUF002", "RUF003"]

# The demo seeds a throwaway sign-in whose whole purpose is to be published, and
# the site builder hands a one-shot key to an in-memory database it deletes on
# the way out. Both are literally named after not being secrets.
"massingbill/services/demo.py" = ["S105", "S106"]
"scripts/build_demo_site.py" = ["S106"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "flask_limiter.*",
    "flask_login.*",
    "flask_migrate.*",
    "flask_wtf.*",
    # WeasyPrint ships no type information, and it is an optional extra that a
    # headless deployment does not install at all.
    "weasyprint.*",
    # boto3/botocore ship no py.typed. The alternative is boto3-stubs, an
    # enormous generated package, pulled in to type one adapter that a
    # standalone install does not even have.
    "boto3.*",
    "botocore.*",
    "joserfc.*",
]
ignore_missing_imports = true

# The optional adapters. They exist now, but a deployment that has not
# installed the matching extra will not have them on disk -- and the
# `no-adapters` CI job deletes them outright. The lazy imports referencing them
# are guarded by ImportError handlers on purpose (SPEC.md 3.2), so "missing" is
# a supported state rather than a broken one.
[[tool.mypy.overrides]]
module = [
    "massingbill.services.entitlement.massing_cloud",
    "massingbill.services.identity.oidc",
    "massingbill.services.storage.s3",
    "massingbill.services.storage.massing_vault",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Standalone integrity (SPEC.md 3, 7.4, 13).
#
# The core must never import an optional adapter. These contracts turn that
# from a code-review opinion into a build failure. The `no-adapters` CI job
# deletes the adapter modules and re-runs the suite as the second proof.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "massingbill"

[[tool.importlinter.contracts]]
name = "Core never imports optional adapters"
type = "forbidden"
source_modules = [
    "massingbill.blueprints",
    "massingbill.models",
    "massingbill.security",
    "massingbill.config",
]
forbidden_modules = [
    "massingbill.services.entitlement.massing_cloud",
    "massingbill.services.identity.oidc",
    "massingbill.services.storage.s3",
    "massingbill.services.storage.massing_vault",
    "massingbill.services.integrations",
]
# The factories themselves. `get_backend("s3")` imports the adapter *inside the
# function*, which is the sanctioned mechanism -- but import-linter is static
# and counts a function-local import as an edge like any other.
#
# This contract was passing vacuously until the adapters were written: you
# cannot resolve an edge to a module that does not exist. So the exception is
# declared here, and the property it was meant to guarantee is asserted at
# runtime instead by `test_no_core_module_imports_an_adapter`, which imports
# the whole core in a subprocess and checks that no adapter reached
# `sys.modules`. That test measures laziness; this contract cannot.
#
# Only the adapters that exist. import-linter treats an ignore that matches
# nothing as an error, which is the right behaviour -- it is what stops a stale
# exception outliving the thing it excused. The last two arrived with P9, and
# the contract broke the moment their modules did, exactly as it should have.
ignore_imports = [
    "massingbill.services.storage -> massingbill.services.storage.s3",
    "massingbill.services.identity -> massingbill.services.identity.oidc",
    "massingbill.services.storage -> massingbill.services.storage.massing_vault",
    "massingbill.services.entitlement -> massingbill.services.entitlement.massing_cloud",
]

[[tool.importlinter.contracts]]
name = "Adapter bases never import their implementations"
type = "forbidden"
source_modules = [
    "massingbill.services.entitlement.base",
    "massingbill.services.identity.base",
    "massingbill.services.storage.base",
]
forbidden_modules = [
    "massingbill.services.entitlement.standalone",
    "massingbill.services.entitlement.massing_cloud",
    "massingbill.services.identity.local",
    "massingbill.services.identity.oidc",
    "massingbill.services.storage.local",
    "massingbill.services.storage.s3",
    "massingbill.services.storage.massing_vault",
]
