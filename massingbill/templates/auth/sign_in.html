{% extends "base.html" %}{% from "_macros.html" import field %}
{% block title %}Sign in &middot; Massing Bill{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="{{ url_for('auth.sign_in') }}" class="stack">
  {{ form.hidden_tag() }}
  {{ field(form.email) }}
  {{ field(form.password) }}
  {{ form.submit(class="button") }}
</form>
<p class="note">No account? <a href="{{ url_for('auth.register_form') }}">Create one</a>.</p>
{% endblock %}
